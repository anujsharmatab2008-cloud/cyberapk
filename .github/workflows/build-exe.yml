name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set Up Python Ecosystem
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Flet Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Flutter Engine (Flet Compatible)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.x' # Direct version sync for current Flet dependencies
        channel: 'stable'
        cache: true

    - name: Pre-Authorize Android SDK Licenses
      run: |
        mkdir -p ${ANDROID_HOME}/licenses
        echo -e "\n2c4dfa0b36514dd41458fc053b4312e0cd0d7f08\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > ${ANDROID_HOME}/licenses/android-sdk-license

    - name: Compile Application to Android APK
      run: |
        flet build apk --no-rich-output

    - name: Upload Finished Installer Asset
      uses: actions/upload-artifact@v4
      with:
        name: Cyber-Aggregator-Android-App
        path: build/apk/*.apk
